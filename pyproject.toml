[project]
name = "langgraph-agentarts-demo"
version = "0.1.0"
description = "LangGraph agent demo on Huawei Cloud AgentArts: runtime hosting, code-interpreter sandbox, memory and Agent Identity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agentarts-sdk",
    "langgraph>=1.0.0",
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
]

[tool.uv]
package = false

[tool.uv.sources]
agentarts-sdk = { path = "../agentarts-sdk-python", editable = true }
